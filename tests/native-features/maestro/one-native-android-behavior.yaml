appId: dev.vxrn.nativefeatures.tests
---
- launchApp:
    clearState: true
- openLink:
    link: nativefeatures://app/one-native-android
- waitFor:
    id: one-native-android-mounted
    timeout: 15000

- tapOn:
    id: one-native-android-prop-mutate
- extendedWaitUntil:
    visible:
      id: one-native-android-prop-value
      text: Expanded Android Compose text prop
    timeout: 5000

- tapOn:
    id: one-native-android-real-button
- extendedWaitUntil:
    visible:
      id: one-native-android-button-status
      text: 'Button taps: 1'
    timeout: 5000
- tapOn:
    id: one-native-android-real-button
- extendedWaitUntil:
    visible:
      id: one-native-android-button-status
      text: 'Button taps: 2'
    timeout: 5000

- tapOn:
    id: one-native-android-switch
- extendedWaitUntil:
    visible:
      id: one-native-android-switch-status
      text: 'Switch: off · Request: on · Revision: 0'
    timeout: 5000
- tapOn:
    id: one-native-android-switch-policy
- extendedWaitUntil:
    visible:
      id: one-native-android-switch-policy-status
      text: 'Policy: accept'
    timeout: 5000
- tapOn:
    id: one-native-android-switch
- extendedWaitUntil:
    visible:
      id: one-native-android-switch-status
      text: 'Switch: on · Request: on · Revision: 0'
    timeout: 5000
- tapOn:
    id: one-native-android-switch-reset
- extendedWaitUntil:
    visible:
      id: one-native-android-switch-status
      text: 'Switch: off · Request: off · Revision: 1'
    timeout: 5000

- tapOn:
    id: one-native-android-reorder
- extendedWaitUntil:
    visible:
      id: one-native-android-reorder
      text: Restore order
    timeout: 5000

- tapOn:
    id: one-native-android-toggle-optional
- extendedWaitUntil:
    notVisible:
      id: one-native-android-optional
    timeout: 5000
- assertVisible:
    id: one-native-android-lifecycle-status
    text: 'Optional: unmounted'
- tapOn:
    id: one-native-android-toggle-optional
- extendedWaitUntil:
    visible:
      id: one-native-android-optional
    timeout: 5000
- assertVisible:
    id: one-native-android-lifecycle-status
    text: 'Optional: mounted'

- tapOn:
    id: one-native-android-disabled-button
- tapOn:
    id: one-native-android-disabled-switch
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: one-native-android-disabled-status
    text: 'Disabled button taps: 0 · Disabled switch taps: 0'

- tapOn:
    id: one-native-android-decoy
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: one-native-android-button-status
    text: 'Button taps: 2'

- assertTreeContains: one-native-android-order-beta
- assertTreeContains: one-native-android-order-alpha
- waitForAnimationToEnd:
    timeout: 5000
- dumpTree: 20
