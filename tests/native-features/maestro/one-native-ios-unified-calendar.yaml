appId: dev.vxrn.native.tests
---
- launchApp
- tapOn:
    text: 'Cancel'
    optional: true
- extendedWaitUntil:
    visible: 'One Native Test Suite'
    timeout: 60000
- openLink: nativefeatures://app/one-native-calendar
- tapOn:
    text: 'Open'
    optional: true
- assertVisible: 'Permission: fullAccess'
- tapOn:
    id: one-native-calendar-run
- assertVisible: 'Permission: fullAccess'
- assertVisible: 'Status: done'
- assertVisible: 'Result: before=none; matched=true; updated=true; removed=true; notFound=E_CALENDAR_NOT_FOUND; invalidUpdate=E_CALENDAR_INPUT; invalid=E_CALENDAR_INPUT; recurrenceListed=true; recurrenceRemoved=true; siblingsKeptAfterUpdate=true; siblingsKeptAfterDelete=true; middleRemoved=true; dateBounded=true; dateRemoved=true; invalidRecurrence=E_CALENDAR_INPUT; invalidRecurrenceEnd=E_CALENDAR_INPUT'
