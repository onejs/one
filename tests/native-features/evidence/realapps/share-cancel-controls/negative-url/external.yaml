appId: com.natew.oneexample
---
- launchApp:
    stopApp: true
    permissions: {}
- extendedWaitUntil:
    visible: "Hello world, from One"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: realapps-open-api
    timeout: 60000
- tapOn:
    id: realapps-open-api
- tapOn:
    id: realapps-api-section-services
- scrollUntilVisible:
    element:
      id: realapps-api-open-url
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: realapps-api-open-url
- tapOn:
    id: realapps-api-open-url
- extendedWaitUntil:
    visible: ".*onestack.*"
    timeout: 20000
- takeScreenshot: system-url
- launchApp:
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible: "Open URL for runner return"
    timeout: 20000
- assertVisible: "Injected route remains inside the original shell"
- takeScreenshot: final
