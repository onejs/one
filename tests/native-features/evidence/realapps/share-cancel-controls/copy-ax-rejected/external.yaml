appId: com.natew.oneexample
---
- launchApp:
    stopApp: true
    permissions: {}
- extendedWaitUntil:
    visible: "Hello world, from One"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: realapps-open-api
    timeout: 60000
- tapOn:
    id: realapps-open-api
- tapOn:
    id: realapps-api-section-services
- scrollUntilVisible:
    element:
      id: realapps-api-share-cancel
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: realapps-api-share-cancel
- tapOn:
    id: realapps-api-share-cancel
- assertVisible: "Copy"
- takeScreenshot: system-share
- tapOn: "Copy"
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 15000
- extendedWaitUntil:
    visible: "Open share for runner cancel"
    timeout: 15000
- assertVisible: "Injected route remains inside the original shell"
- takeScreenshot: final
