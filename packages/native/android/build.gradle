buildscript {
    def composeKotlinVersion =
        rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.1.20"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$composeKotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.facebook.react'

group = 'dev.vxrn'

android {
    namespace "dev.vxrn.nativebridge"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 23)
        targetSdkVersion safeExtGet("targetSdkVersion", 35)

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                // the prefab dependencies (worklets) build only these abis,
                // so building more would link against nothing.
                abiFilters(*reactNativeArchitectures())
            }
        }
    }

    buildFeatures {
        compose true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

react {
    jsRootDir = file("../src")
    libraryName = "OneNativeSpec"
    codegenJavaPackageName = "dev.onejs.onenative"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeArchitectures() {
    def value = project.findProperty("reactNativeArchitectures")
    def parsed = value?.toString()?.split(",")?.collect { it.trim() }?.findAll { !it.isEmpty() }
    return (parsed == null || parsed.isEmpty()) ?
        ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"] :
        parsed
}

repositories {
    google()
    mavenCentral()
}

def composeUiVersion = "1.11.4"
def material3Version = "1.4.0"
def kotlinVersion = safeExtGet("kotlinVersion", "2.1.20")

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.core:core:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.compose.ui:ui:$composeUiVersion"
    implementation "androidx.compose.foundation:foundation:$composeUiVersion"
    implementation "androidx.compose.material3:material3:$material3Version"
    if (rootProject.subprojects.find { it.name == "react-native-worklets" } != null) {
        implementation project(":react-native-worklets")
    } else {
        throw new GradleException("[OneNative] `react-native-worklets` is a required peer: install it so autolinking provides the native project.")
    }
}
