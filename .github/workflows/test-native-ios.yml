name: iOS Native Tests
env:
  # Specify an iOS version to test on.
  simulator_ios_version: 26.4
  # Name of the simulator device to use.
  simulator_device_name: iPhone 17 Pro
  # Pinned so a run never picks up an incompatible appium/driver pair.
  appium_version: 3.6.0
  appium_xcuitest_version: 12.5.0

on:
  push:
    branches:
      - main
      - ci/native-tests-free-runners
      - ci/rolldown-native-tests
      - ci/test-native-ios-matrix-split
      - react-native-82
    paths:
      - '.github/actions/install/**'
      - '.github/workflows/build-ios-test-container-app.yml'
      - '.github/workflows/test-native-ios.yml'
      - 'bun.lock'
      - 'package.json'
      - 'packages/one/metro-entry.js'
      - 'packages/one/metro-entry-ctx.js'
      - 'packages/one/src/**/*.native.*'
      - 'packages/one/src/**/*.ios.*'
      - 'packages/one/src/**/*.android.*'
      - 'packages/one/src/cli/prebuild.ts'
      - 'packages/one/src/cli/runAndroid.ts'
      - 'packages/one/src/cli/runIos.ts'
      - 'packages/one/src/metro-config/**'
      - 'packages/vite-plugin-metro/**'
      - 'packages/vxrn/**'
      - 'tests/rn-test-container/app.json'
      - 'tests/rn-test-container/e2e/**'
      - 'tests/rn-test-container/ios/**'
      - 'tests/rn-test-container/package.json'
      - 'tests/rn-test-container/react-native.config.cjs'
      - 'tests/rn-test-container/scripts/**'
      - 'tests/test/**'
      - 'packages/test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-ios-test-container-dev:
    name: Build iOS RN Test App (Dev)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Debug

  build-ios-test-container-prod:
    name: Build iOS RN Test App (Prod)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Release

  test-ios-native:
    name: Native iOS Tests (${{ matrix.env }}, ${{ matrix.bundler }})
    needs:
      - build-ios-test-container-dev
      - build-ios-test-container-prod
    runs-on: macos-26
    # a slow runner roughly doubles this job: dev/metro ran 24m48s on 2026-08-15
    # and 45m51s on 2026-08-18, where the metro dev bundle alone went 22s -> 56s.
    # 45 killed that job 10 seconds after its tests had all passed.
    timeout-minutes: 60
    # rolldown:prod is experimental — don't fail the workflow on it.
    # (prod used to crash on launch with a SIGSEGV from an upstream RN
    # TurboModule/Hermes concurrency bug — now fixed via a builtInDepPatches
    # patch to react-native; see tests/test/IOS_PROD_CRASH.md. the harness also
    # fails a crash-on-launch fast (~10m) instead of timing out (~48m).)
    continue-on-error: ${{ matrix.env == 'prod' && matrix.bundler == 'rolldown' }}
    strategy:
      # one matrix entry's failure shouldn't kill the others — they're independent runs
      fail-fast: false
      matrix:
        include:
          - env: dev
            bundler: metro
            test-script: test-ios:dev
          - env: dev
            bundler: rolldown
            test-script: test-ios:rolldown:dev
          - env: prod
            bundler: metro
            test-script: test-ios:prod
          - env: prod
            bundler: rolldown
            test-script: test-ios:rolldown:prod
    steps:
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install
        with:
          install-playwright: 'false'

      - name: Download Built Test Container App (Dev)
        if: ${{ matrix.env == 'dev' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-dev.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-dev.outputs.built-app-path }}

      - name: Download Built Test Container App (Prod)
        if: ${{ matrix.env == 'prod' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-prod.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.built-app-path }}

      - name: Download Hermes V1 hermesc
        if: ${{ matrix.env == 'prod' && needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
        id: download-hermesc
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.hermesc-path }}

      - name: Get Simulator UDID
        id: get-simulator-udid
        env:
          SIMULATOR_IOS_VERSION: ${{ env.simulator_ios_version }}
          SIMULATOR_DEVICE_NAME: ${{ env.simulator_device_name }}
        run: |
          AVAILABLE_SIMULATORS=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS")) | .key as $runtime | .value[] | { runtime: $runtime, name: .name, udid: .udid }]')
          echo "Available simulators: $AVAILABLE_SIMULATORS"

          # runtime ids spell the version with dashes, e.g. iOS 26.4 -> ...SimRuntime.iOS-26-4
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_IOS_VERSION//./-}"
          SELECTED_SIMULATOR=$(echo $AVAILABLE_SIMULATORS | jq -r "[.[] | select(.runtime == \"$RUNTIME_ID\") | select(.name == \"$SIMULATOR_DEVICE_NAME\")] | first")
          if [ -z "$SELECTED_SIMULATOR" ] || [ "$SELECTED_SIMULATOR" = "null" ]; then
            echo "Error: No simulator found for runtime $RUNTIME_ID and device name $SIMULATOR_DEVICE_NAME"
            echo "Available devices:"
            echo "$AVAILABLE_SIMULATORS" | jq -r '.[] | "\(.name) (\(.runtime))"'
            exit 1
          fi
          echo "Selected simulator: $SELECTED_SIMULATOR"

          SIMULATOR_UDID=$(echo $SELECTED_SIMULATOR | jq -r .udid)
          if [ -z "$SIMULATOR_UDID" ] || [ "$SIMULATOR_UDID" = "null" ]; then
            echo "Error: Could not get simulator UDID"
            exit 1
          fi
          echo "Simulator UDID: $SIMULATOR_UDID"
          echo "simulator_udid=$SIMULATOR_UDID" >> $GITHUB_OUTPUT

      - name: Boot Simulator
        env:
          SIMULATOR_UDID: ${{ steps.get-simulator-udid.outputs.simulator_udid }}
        run: xcrun simctl boot $SIMULATOR_UDID

      - name: Install Appium
        env:
          APPIUM_VERSION: ${{ env.appium_version }}
          APPIUM_XCUITEST_VERSION: ${{ env.appium_xcuitest_version }}
        run: |
          # deliberately not cached: the xcuitest driver resolves `appium` from
          # its own node_modules under ~/.appium, so a restored tree drifts from
          # whatever `npm install -g appium` put on this runner. that drift
          # still lets the server start, then fails every session with
          # "Could not find a driver for automationName 'XCUITest'". a clean
          # pinned install takes ~2min and can't drift.
          npm install -g appium@$APPIUM_VERSION
          appium driver install xcuitest@$APPIUM_XCUITEST_VERSION
          appium --version
          appium driver list --installed
          # loading the driver is the only thing that proves the install is
          # usable; `appium --version` and `driver list` both pass on a tree
          # whose driver can't import appium.
          cd ~/.appium && node --input-type=module -e 'await import("appium-xcuitest-driver")'

      - name: Start Appium Server
        run: |
          # timestamps make the log usable for finding where a slow session went
          appium --log-timestamp > /tmp/appium.log 2>&1 &
          # wait for appium to be ready
          for i in {1..30}; do
            if curl -s http://localhost:4723/status | grep -q '"ready":true'; then
              echo "Appium ready after $i seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Appium failed to start"
              cat /tmp/appium.log
              exit 1
            fi
            sleep 1
          done

      - name: Pre-build WebDriverAgent
        env:
          SIMULATOR_UDID: ${{ steps.get-simulator-udid.outputs.simulator_udid }}
        run: |
          # WDA builds on first session and can take 15+ min on CI.
          # use appium's xcodebuild to compile WDA ahead of time.
          APPIUM_XCUITEST_PATH=$(appium driver run xcuitest print-wda-path 2>/dev/null || echo "")
          # strip ansi codes and whitespace
          APPIUM_XCUITEST_PATH=$(echo "$APPIUM_XCUITEST_PATH" | sed 's/\x1b\[[0-9;]*m//g' | tr -d '[:space:]')
          # fallback: search known appium driver install locations
          if [ -z "$APPIUM_XCUITEST_PATH" ] || [ ! -d "$APPIUM_XCUITEST_PATH" ]; then
            echo "print-wda-path failed or returned invalid path: '$APPIUM_XCUITEST_PATH'"
            APPIUM_XCUITEST_PATH=$(find ~/.appium -name "WebDriverAgent.xcodeproj" -print -quit 2>/dev/null | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -n "$APPIUM_XCUITEST_PATH" ] && [ -d "$APPIUM_XCUITEST_PATH" ]; then
            echo "Building WDA from: $APPIUM_XCUITEST_PATH"
            xcodebuild build-for-testing \
              -project "$APPIUM_XCUITEST_PATH/WebDriverAgent.xcodeproj" \
              -scheme WebDriverAgentRunner \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath /tmp/wda-build \
              -quiet || echo "WDA pre-build failed, will build on first session"
          else
            echo "Could not find WDA path, will build on first session"
          fi

      - name: Run Tests
        env:
          SIMULATOR_UDID: ${{ steps.get-simulator-udid.outputs.simulator_udid }}
          IOS_TEST_CONTAINER_PATH_DEV: ${{ matrix.env == 'dev' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.built-app-path) || '' }}
          IOS_TEST_CONTAINER_PATH_PROD: ${{ matrix.env == 'prod' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.built-app-path) || '' }}
          HERMESC_PATH: ${{ steps.download-hermesc.outputs.cache-matched-key && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.hermesc-path) || '' }}
        run: |
          bun run --filter test-test ${{ matrix.test-script }}

      - name: Upload Appium Logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-tests-${{ matrix.env }}-${{ matrix.bundler }}.log
          path: /tmp/appium.log

      - name: Upload Appium Screenshots
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-screenshots-${{ matrix.env }}-${{ matrix.bundler }}
          path: /tmp/appium-screenshots
