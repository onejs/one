name: iOS Native Tests
env:
  # Specify an iOS version to test on.
  simulator_ios_version: '27.0'
  # Name of the simulator device to use.
  simulator_device_name: iPhone 18 Pro
  # Pinned so a run never picks up an incompatible appium/driver pair.
  appium_version: 3.6.0
  appium_xcuitest_version: 12.5.0

on:
  push:
    branches:
      - main
      - v2-beta
      - ci/native-tests-free-runners
      - ci/rolldown-native-tests
      - ci/test-native-ios-matrix-split
      - react-native-82
    paths:
      - '.github/actions/install/**'
      - '.github/actions/ios-ui-test-setup/**'
      - '.github/workflows/build-ios-test-container-app.yml'
      - '.github/workflows/test-native-ios.yml'
      - 'bun.lock'
      - 'patches/react-native-webgpu@0.5.14.patch'
      - 'package.json'
      - 'packages/one/metro-entry.js'
      - 'packages/one/metro-entry-ctx.js'
      - 'packages/one/src/**/*.native.*'
      - 'packages/one/src/**/*.ios.*'
      - 'packages/one/src/**/*.android.*'
      - 'packages/one/src/cli/prebuild.ts'
      - 'packages/one/src/cli/runAndroid.ts'
      - 'packages/one/src/cli/runIos.ts'
      - 'packages/one/src/metro-config/**'
      - 'packages/vite-plugin-metro/**'
      - 'packages/vxrn/**'
      - 'packages/one/ios/**'
      - 'packages/one/cpp/**'
      - 'packages/one/nitrogen/**'
      - 'packages/one/codegen/**'
      - 'packages/one/schema.json'
      - 'packages/one/src/platform/**'
      - 'packages/one/One.podspec'
      - 'packages/one/package.json'
      - 'packages/one/nitro.json'
      - 'packages/one/react-native.config.cjs'
      - 'tests/native-features/**'
      - 'examples/one-basic/**'
      - 'tests/rn-test-container/app.json'
      - 'tests/rn-test-container/e2e/**'
      - 'tests/rn-test-container/ios/**'
      - 'tests/rn-test-container/package.json'
      - 'tests/rn-test-container/react-native.config.cjs'
      - 'tests/rn-test-container/scripts/**'
      - 'tests/test/**'
      - 'packages/test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generated-swiftui:
    name: Generated SwiftUI bindings
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
      - name: Compile and exercise generated source glue
        run: |
          bun tests/native-features/scripts/native-source-swift-proof.ts
          bun tests/native-features/scripts/native-source-events-proof.ts
      - name: Verify SDK generation, Swift compilation, and contracts
        working-directory: packages/one
        run: |
          bun run generate:check
          bun run build
          git diff --exit-code -- types/platform/generated
          bun run typecheck
          bun run test
      - name: Generate the Basic starter iOS project
        working-directory: examples/one-basic
        run: bun run prebuild:native --platform ios --no-install

  prepare-native-features-ios:
    name: Prepare One Native consumer (iOS)
    needs: generated-swiftui
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload-native-preparation.outputs.artifact-id }}
      run-attempt: ${{ github.run_attempt }}
    # prebuild and pods need their own budget before the near-hour compile.
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
      - name: Generate the One Native consumer project
        working-directory: tests/native-features
        env:
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild:native --platform ios --no-install
      - name: Install consumer pods
        working-directory: tests/native-features/ios
        run: USE_FRAMEWORKS=static pod install
      # archive the whole prepared workspace, including installed dependencies
      # and generated package outputs. tar preserves pod links and script modes.
      - name: Archive the prepared native workspace
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess

          workspace = pathlib.Path.cwd().resolve()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA'], 'preparation source mismatch'
          # an external dependency would not survive transfer to a fresh runner.
          for root, directories, files in os.walk(workspace):
              if pathlib.Path(root) == workspace:
                  directories.remove('.git')
              for name in directories + files:
                  path = pathlib.Path(root) / name
                  if path.is_symlink():
                      assert path.resolve().is_relative_to(workspace), f'external prepared symlink: {path}'
          ios = workspace / 'tests/native-features/ios'
          assert (ios / 'NativeFeatureTests.xcworkspace/contents.xcworkspacedata').is_file(), 'missing prepared workspace'
          assert (ios / 'Podfile.lock').read_bytes() == (ios / 'Pods/Manifest.lock').read_bytes(), 'pods lock mismatch'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'one-native-preparation'
          output.mkdir()
          archive = output / 'workspace.tar.gz'
          subprocess.run(['tar', '--exclude=./.git', '-czf', str(archive), '-C', str(workspace), '.'], check=True)
          receipt = {
              'sourceRevision': source,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'runID': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workspace': str(workspace),
              'home': str(pathlib.Path.home()),
              'architecture': os.uname().machine,
              'node': str(pathlib.Path(shutil.which('node')).resolve()),
              'nodeVersion': subprocess.check_output(['node', '--version'], text=True).strip(),
              'bunVersion': subprocess.check_output(['bun', '--version'], text=True).strip(),
              'xcodeVersion': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'archiveSHA256': subprocess.check_output(['shasum', '-a', '256', str(archive)], text=True).split()[0],
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYTHON
      - name: Upload the prepared native workspace
        id: upload-native-preparation
        uses: actions/upload-artifact@v7
        with:
          name: one-native-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/one-native-preparation/workspace.tar.gz
            ${{ runner.temp }}/one-native-preparation/receipt.json

  build-native-features-ios:
    name: Build One Native consumer (iOS)
    needs: prepare-native-features-ios
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      # match the preparation toolchain without repeating install or prebuild.
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: 'package.json'
      - name: Require the prepared native artifact
        env:
          PREPARATION_ARTIFACT_ID: ${{ needs.prepare-native-features-ios.outputs.artifact-id }}
        run: test -n "$PREPARATION_ARTIFACT_ID"
      - name: Download the prepared native workspace
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.prepare-native-features-ios.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/one-native-preparation
      - name: Verify and restore the prepared native workspace
        shell: bash
        env:
          PREPARATION_RUN_ATTEMPT: ${{ needs.prepare-native-features-ios.outputs.run-attempt }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess

          workspace = pathlib.Path.cwd().resolve()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'one-native-preparation'
          receipt = json.loads((output / 'receipt.json').read_text())
          expected = {
              'sourceRevision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'runID': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['PREPARATION_RUN_ATTEMPT'],
              'workspace': str(workspace),
              'home': str(pathlib.Path.home()),
              'architecture': os.uname().machine,
              'node': str(pathlib.Path(shutil.which('node')).resolve()),
              'nodeVersion': subprocess.check_output(['node', '--version'], text=True).strip(),
              'bunVersion': subprocess.check_output(['bun', '--version'], text=True).strip(),
              'xcodeVersion': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
          }
          assert expected['sourceRevision'] == os.environ['GITHUB_SHA'], 'compile source mismatch'
          for key, value in expected.items():
              assert receipt[key] == value, f'prepared workspace {key} mismatch'
          archive = output / 'workspace.tar.gz'
          digest = subprocess.check_output(['shasum', '-a', '256', str(archive)], text=True).split()[0]
          assert receipt['archiveSHA256'] == digest, 'prepared workspace digest mismatch'
          subprocess.run(['tar', '-xzf', str(archive), '-C', str(workspace)], check=True)
          ios = workspace / 'tests/native-features/ios'
          assert (ios / 'NativeFeatureTests.xcworkspace/contents.xcworkspacedata').is_file(), 'missing prepared workspace'
          assert (ios / 'Podfile.lock').read_bytes() == (ios / 'Pods/Manifest.lock').read_bytes(), 'pods lock mismatch'
          PYTHON
      # the fixtures run this build on the runner's arm64 simulator; a generic
      # destination also compiles x86_64 and doubles the build past the cap.
      - name: Compile One Native and generated Fabric code
        working-directory: tests/native-features/ios
        run: >-
          xcodebuild -workspace NativeFeatureTests.xcworkspace -scheme NativeFeatureTests
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      # the compile alone takes most of an hour, so the fixtures run in their
      # own job against this app. the key spans attempts so a rerun of the
      # fixtures alone restores the first attempt's app.
      - name: Save the One Native consumer app
        uses: actions/cache/save@v5
        with:
          key: native-features-ios-app-${{ github.run_id }}
          path: tests/native-features/ios/build/Build/Products/Debug-iphonesimulator/NativeFeatureTests.app

  native-features-ios:
    name: One Native feature fixtures (iOS)
    needs: build-native-features-ios
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
      - name: Restore the One Native consumer app
        id: restore-native-features-app
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: native-features-ios-app-${{ github.run_id }}
          path: tests/native-features/ios/build/Build/Products/Debug-iphonesimulator/NativeFeatureTests.app

      - name: Archive the restored One Native consumer app
        shell: bash
        env:
          APP_CACHE_KEY: native-features-ios-app-${{ github.run_id }}
          APP_CACHE_MATCHED_KEY: ${{ steps.restore-native-features-app.outputs.cache-matched-key }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib, subprocess

          app = pathlib.Path('tests/native-features/ios/build/Build/Products/Debug-iphonesimulator/NativeFeatureTests.app')
          assert os.environ['APP_CACHE_MATCHED_KEY'] == os.environ['APP_CACHE_KEY'], 'app cache key mismatch'
          assert app.is_dir(), f'missing restored app: {app}'
          plist = app / 'Info.plist'
          identity = plistlib.loads(plist.read_bytes())
          executable = app / identity['CFBundleExecutable']
          assert executable.is_file() and os.access(executable, os.X_OK), f'missing executable: {executable}'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'one-native-features-ios-app'
          output.mkdir()
          archive = output / 'NativeFeatureTests.app.tar.gz'
          subprocess.run(['tar', '-czf', str(archive), '-C', str(app.parent), app.name], check=True)

          def sha256(path):
              return subprocess.check_output(['shasum', '-a', '256', str(path)], text=True).split()[0]

          receipt = {
              'sourceRevision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'runURL': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'cacheKey': os.environ['APP_CACHE_MATCHED_KEY'],
              'archive': archive.name,
              'archiveSHA256': sha256(archive),
              'app': app.name,
              'bundleIdentifier': identity['CFBundleIdentifier'],
              'executable': identity['CFBundleExecutable'],
              'executableSHA256': sha256(executable),
              'infoPlistSHA256': sha256(plist),
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYTHON

      - name: Upload the One Native consumer app
        uses: actions/upload-artifact@v7
        with:
          name: one-native-features-ios-app
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/one-native-features-ios-app/NativeFeatureTests.app.tar.gz
            ${{ runner.temp }}/one-native-features-ios-app/receipt.json

      - name: Prepare iOS UI tests
        id: setup-ios-ui-tests
        uses: ./.github/actions/ios-ui-test-setup
        with:
          simulator_ios_version: ${{ env.simulator_ios_version }}
          simulator_device_name: ${{ env.simulator_device_name }}
          appium_version: ${{ env.appium_version }}
          appium_xcuitest_version: ${{ env.appium_xcuitest_version }}

      # the zoom fixture drives the simulator through the axe cli
      # (scripts/one-native-conformance.ts), which runner images do not ship.
      - name: Install axe
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/axe.tgz" \
            https://github.com/cameroncooke/AXe/releases/download/v1.8.0/AXe-macOS-v1.8.0-universal.tar.gz
          echo "7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version

      # simctl launch returns before the app finishes starting.
      - name: Warm the Shortcuts app
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
        run: python3 tests/native-features/scripts/warm-shortcuts.py

      - name: Install native debugger CLI
        run: |
          bun install --global xcodebuildmcp@2.7.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/xcodebuildmcp" --version

      - name: Run One Native feature fixtures
        working-directory: tests/native-features
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
          IOS_TEST_CONTAINER_PATH_DEV: ${{ github.workspace }}/tests/native-features/ios/build/Build/Products/Debug-iphonesimulator/NativeFeatureTests.app
        run: bun run test-ios:dev --reporter=verbose --bail=1

      - name: Capture native fixture failure diagnostics
        if: ${{ failure() }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
        run: |
          python3 - <<'PYTHON'
          import datetime, hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path('/tmp/one-native-zoom-e2e')
          root.mkdir(parents=True, exist_ok=True)
          udid = os.environ.get('SIMULATOR_UDID', '')
          axe = shutil.which('axe')
          identity = {
              'capturedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'simulatorUDID': udid,
              'developerDir': os.environ.get('DEVELOPER_DIR'),
              'axePath': axe,
              'sourceRevision': os.environ.get('GITHUB_SHA'),
              'runID': os.environ.get('GITHUB_RUN_ID'),
              'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
          }
          for name, path in {'axe': axe, 'axeArchive': str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'axe.tgz')}.items():
              try:
                  identity[name + 'SHA256'] = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              except (OSError, TypeError) as error:
                  identity[name + 'Error'] = str(error)
          (root / 'automation-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          # query both sides of the remote session; app launch logs do not cover
          # the host provider or simulator automation daemon exchange.
          automation = (
              'process IN {"testmanagerd", "automationd", "remoteautomationd", "remoted", "CoreSimulatorService", "Simulator", "DeviceHub", "axe"} '
              'OR subsystem CONTAINS[c] "XCTest" OR subsystem CONTAINS[c] "CoreSimulator" '
              'OR subsystem CONTAINS[c] "automation" OR subsystem CONTAINS[c] "DTX" '
              'OR subsystem CONTAINS[c] "testmanager" OR eventMessage CONTAINS[c] "XCUI" '
              'OR eventMessage CONTAINS[c] "RemoteAutomation" '
              'OR eventMessage CONTAINS[c] "DaemonConnectionProvider"'
          )
          # collect the failed warmup first: older logs can exhaust the query
          # before reaching the 90-second warmup's provider exchange.
          log = ['log', 'show', '--last', '5m', '--style', 'compact', '--info', '--debug', '--predicate', automation]
          commands = {
              'simulator-automation-log.txt': ['xcrun', 'simctl', 'spawn', udid, *log],
              'host-automation-log.txt': ['/usr/bin/log', *log[1:]],
              'host-processes.txt': ['ps', '-axo', 'pid,ppid,state,comm'],
              # the app's own log keeps its javascript warnings, such as why the
              # metro socket closed, which never reach the dev server once it has.
              'app-log.txt': ['xcrun', 'simctl', 'spawn', os.environ.get('SIMULATOR_UDID') or 'booted', 'log', 'show', '--last', '60m', '--style', 'compact', '--predicate', 'process == "NativeFeatureTests"'],
              # the processes that launch other apps, for a system app such as
              # shortcuts that a native link opens late or never.
              'system-launch-log.txt': ['xcrun', 'simctl', 'spawn', os.environ.get('SIMULATOR_UDID') or 'booted', 'log', 'show', '--last', '60m', '--style', 'compact', '--predicate', 'process IN {"SpringBoard", "runningboardd", "lsd", "Shortcuts"} OR subsystem == "com.apple.launchservices"'],
          }
          commands.update({
              'xcode-selection.txt': ['xcode-select', '-p'],
              'xcode-version.txt': ['xcodebuild', '-version'],
              'host-version.txt': ['sw_vers'],
              'simulator-runtimes.txt': ['xcrun', 'simctl', 'list', 'runtimes', '--json'],
              'simulator-devices.txt': ['xcrun', 'simctl', 'list', 'devices', '--json'],
              'simulator-version.txt': ['xcrun', 'simctl', 'spawn', udid, 'sw_vers'],
              'axe-version.txt': ['axe', '--version'],
          })
          for name, command in commands.items():
              header = f'command={json.dumps(command)}\n'
              # never attribute another booted device's automation evidence to
              # this job when setup failed before publishing its selected udid.
              if name.startswith('simulator-') and name not in ('simulator-runtimes.txt', 'simulator-devices.txt') and not udid:
                  (root / name).write_text(header + 'skipped: selected simulator udid unavailable\n')
                  continue
              try:
                  result = subprocess.run(command, capture_output=True, text=True,
                                          timeout=120 if name in ('host-processes.txt', 'app-log.txt', 'system-launch-log.txt') else 60)
                  output = f'exit={result.returncode}\n{result.stdout}\n{result.stderr}'
              except subprocess.TimeoutExpired as error:
                  def decode(value):
                      return value.decode(errors='replace') if isinstance(value, bytes) else (value or '')
                  output = f'timeout={error.timeout}\n{decode(error.stdout)}\n{decode(error.stderr)}'
              except OSError as error:
                  output = f'error={error!r}\n'
              (root / name).write_text(header + output)
          PYTHON

      - name: Upload One Native runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: one-native-features-ios
          include-hidden-files: true
          path: |
            tests/native-features/node_modules/.test/*-server.log
            /tmp/appium.log
            /tmp/appium-screenshots
            /tmp/one-native-zoom-e2e/*.json*
            /tmp/one-native-zoom-e2e/*.txt
            ~/Library/Developer/XcodeBuildMCP/workspaces/*/logs/**

  build-ios-test-container-dev:
    name: Build iOS RN Test App (Dev)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Debug

  build-ios-test-container-prod:
    name: Build iOS RN Test App (Prod)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Release

  test-ios-native:
    name: Native iOS Tests (${{ matrix.env }}, ${{ matrix.bundler }})
    needs:
      - build-ios-test-container-dev
      - build-ios-test-container-prod
    runs-on: xcode-27
    # a slow runner roughly doubles this job: dev/metro ran 24m48s on 2026-08-15
    # and 45m51s on 2026-08-18, where the metro dev bundle alone went 22s -> 56s.
    # 45 killed that job 10 seconds after its tests had all passed.
    timeout-minutes: 60
    # rolldown:prod is experimental — don't fail the workflow on it.
    # (prod used to crash on launch with a SIGSEGV from an upstream RN
    # TurboModule/Hermes concurrency bug — now fixed via a builtInDepPatches
    # patch to react-native; see tests/test/IOS_PROD_CRASH.md. the harness also
    # fails a crash-on-launch fast (~10m) instead of timing out (~48m).)
    continue-on-error: ${{ matrix.env == 'prod' && matrix.bundler == 'rolldown' }}
    strategy:
      # one matrix entry's failure shouldn't kill the others — they're independent runs
      fail-fast: false
      matrix:
        include:
          - env: dev
            bundler: metro
            test-script: test-ios:dev
          - env: dev
            bundler: rolldown
            test-script: test-ios:rolldown:dev
          - env: prod
            bundler: metro
            test-script: test-ios:prod
          - env: prod
            bundler: rolldown
            test-script: test-ios:rolldown:prod
    steps:
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install
        with:
          install-playwright: 'false'

      - name: Download Built Test Container App (Dev)
        if: ${{ matrix.env == 'dev' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-dev.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-dev.outputs.built-app-path }}

      - name: Download Built Test Container App (Prod)
        if: ${{ matrix.env == 'prod' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-prod.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.built-app-path }}

      - name: Download Hermes V1 hermesc
        if: ${{ matrix.env == 'prod' && needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
        id: download-hermesc
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.hermesc-path }}

      - name: Download Hermes V1 hermesc (Dev)
        if: ${{ matrix.env == 'dev' && matrix.bundler == 'rolldown' && needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
        id: download-hermesc-dev
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
          path: ${{ needs.build-ios-test-container-dev.outputs.hermesc-path }}

      - name: Validate Hermes V1 hermesc (Dev)
        if: ${{ matrix.env == 'dev' && matrix.bundler == 'rolldown' }}
        env:
          HERMESC_CACHE_KEY: ${{ needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
          HERMESC_MATCHED_KEY: ${{ steps.download-hermesc-dev.outputs.cache-matched-key }}
          HERMESC_PATH: ${{ format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.hermesc-path) }}
        run: |
          [ -n "$HERMESC_MATCHED_KEY" ] || { echo "hermesc cache restore produced no matched key for $HERMESC_CACHE_KEY"; exit 1; }
          [ "$HERMESC_MATCHED_KEY" = "$HERMESC_CACHE_KEY" ] || { echo "hermesc key mismatch: wanted $HERMESC_CACHE_KEY, got $HERMESC_MATCHED_KEY"; exit 1; }
          [ -f "$HERMESC_PATH" ] || { echo "hermesc missing at $HERMESC_PATH"; exit 1; }
          [ -x "$HERMESC_PATH" ] || { echo "hermesc not executable at $HERMESC_PATH"; exit 1; }
          echo "hermesc validated: $HERMESC_PATH ($HERMESC_MATCHED_KEY)"

      - name: Prepare iOS UI tests
        id: setup-ios-ui-tests
        uses: ./.github/actions/ios-ui-test-setup
        with:
          simulator_ios_version: ${{ env.simulator_ios_version }}
          simulator_device_name: ${{ env.simulator_device_name }}
          appium_version: ${{ env.appium_version }}
          appium_xcuitest_version: ${{ env.appium_xcuitest_version }}

      - name: Run Tests
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
          IOS_TEST_CONTAINER_PATH_DEV: ${{ matrix.env == 'dev' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.built-app-path) || '' }}
          IOS_TEST_CONTAINER_PATH_PROD: ${{ matrix.env == 'prod' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.built-app-path) || '' }}
          HERMESC_PATH: ${{ steps.download-hermesc.outputs.cache-matched-key && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.hermesc-path) || steps.download-hermesc-dev.outputs.cache-matched-key && format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.hermesc-path) || '' }}
        run: |
          if [ '${{ matrix.env }}' = dev ] && [ '${{ matrix.bundler }}' = rolldown ]; then
            export ONE_NATIVE_BUNDLE_TRACE="$RUNNER_TEMP/native-bundle-transport.jsonl"
            export ONE_NATIVE_HMR_TRACE="$RUNNER_TEMP/native-hmr-delivery.jsonl"
            xcrun simctl spawn "$SIMULATOR_UDID" log stream \
              --style ndjson --level debug \
              --predicate 'process == "RNTestContainer" OR subsystem == "com.apple.CFNetwork"' \
              > "$RUNNER_TEMP/native-bundle-network.jsonl" 2>&1 &
            native_log_pid=$!
            trap 'kill "$native_log_pid" 2>/dev/null || true; wait "$native_log_pid" 2>/dev/null || true' EXIT
          fi
          bun run --filter test-test ${{ matrix.test-script }}

      - name: Upload Native Bundle Diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.env == 'dev' && matrix.bundler == 'rolldown' }}
        continue-on-error: true
        with:
          name: native-bundle-diagnostics
          path: |
            ${{ runner.temp }}/native-bundle-transport.jsonl
            ${{ runner.temp }}/native-bundle-network.jsonl
            ${{ runner.temp }}/native-hmr-delivery.jsonl

      - name: Upload Appium Logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-tests-${{ matrix.env }}-${{ matrix.bundler }}.log
          path: /tmp/appium.log

      - name: Upload Appium Screenshots
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-screenshots-${{ matrix.env }}-${{ matrix.bundler }}
          path: /tmp/appium-screenshots

      # the dev server's own output is the only record of what it did with a
      # device's HMR socket and file edits; the test log shows only the app side.
      - name: Upload Dev Server Log
        uses: actions/upload-artifact@v7
        if: ${{ always() && matrix.env == 'dev' }}
        continue-on-error: true
        with:
          name: dev-server-${{ matrix.env }}-${{ matrix.bundler }}.log
          path: tests/test/node_modules/.test/dev-server.log
          include-hidden-files: true
