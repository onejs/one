name: iOS Native Tests
env:
  # Specify an iOS version to test on.
  simulator_ios_version: '27.0'
  # Name of the simulator device to use.
  simulator_device_name: iPhone 18 Pro
  # Pinned so a run never picks up an incompatible appium/driver pair.
  appium_version: 3.6.0
  appium_xcuitest_version: 12.5.0

on:
  push:
    branches:
      - main
      - v2-beta
      - ci/native-tests-free-runners
      - ci/rolldown-native-tests
      - ci/test-native-ios-matrix-split
      - react-native-82
    paths:
      - '.github/actions/install/**'
      - '.github/actions/ios-ui-test-setup/**'
      - '.github/workflows/build-ios-test-container-app.yml'
      - '.github/workflows/test-native-ios.yml'
      - 'bun.lock'
      - 'patches/react-native-webgpu@0.5.14.patch'
      - 'package.json'
      - 'packages/one/metro-entry.js'
      - 'packages/one/metro-entry-ctx.js'
      - 'packages/one/src/**/*.native.*'
      - 'packages/one/src/**/*.ios.*'
      - 'packages/one/src/**/*.android.*'
      - 'packages/one/src/cli/prebuild.ts'
      - 'packages/one/src/cli/runAndroid.ts'
      - 'packages/one/src/cli/runIos.ts'
      - 'packages/one/src/metro-config/**'
      - 'packages/vite-plugin-metro/**'
      - 'packages/vxrn/**'
      - 'packages/one/ios/**'
      - 'packages/one/cpp/**'
      - 'packages/one/nitrogen/**'
      - 'packages/one/codegen/**'
      - 'packages/one/schema.json'
      - 'packages/one/src/platform/**'
      - 'packages/one/One.podspec'
      - 'packages/one/package.json'
      - 'packages/one/nitro.json'
      - 'packages/one/react-native.config.cjs'
      - 'tests/native-features/**'
      - 'examples/one-basic/**'
      - 'tests/rn-test-container/app.json'
      - 'tests/rn-test-container/e2e/**'
      - 'tests/rn-test-container/ios/**'
      - 'tests/rn-test-container/package.json'
      - 'tests/rn-test-container/react-native.config.cjs'
      - 'tests/rn-test-container/scripts/**'
      - 'tests/test/**'
      - 'packages/test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generated-swiftui:
    name: Generated SwiftUI bindings
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
      - name: Compile and exercise generated source glue
        run: |
          bun tests/native-features/scripts/native-source-swift-proof.ts
          bun tests/native-features/scripts/native-source-events-proof.ts
      - name: Verify SDK generation, Swift compilation, and contracts
        working-directory: packages/one
        run: |
          bun run generate:check
          bun run build
          git diff --exit-code -- types/platform/generated
          bun run typecheck
          bun run test
      - name: Generate the Basic starter iOS project
        working-directory: examples/one-basic
        run: bun run prebuild:native --platform ios --no-install
      - name: Generate the One Native consumer project
        working-directory: tests/native-features
        env:
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild:native --platform ios --no-install
      - name: Install consumer pods
        working-directory: tests/native-features/ios
        run: USE_FRAMEWORKS=static pod install
      - name: Compile One Native and generated Fabric code
        working-directory: tests/native-features/ios
        run: >-
          xcodebuild -workspace NativeFeatureTests.xcworkspace -scheme NativeFeatureTests
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Prepare iOS UI tests
        id: setup-ios-ui-tests
        uses: ./.github/actions/ios-ui-test-setup
        with:
          simulator_ios_version: ${{ env.simulator_ios_version }}
          simulator_device_name: ${{ env.simulator_device_name }}
          appium_version: ${{ env.appium_version }}
          appium_xcuitest_version: ${{ env.appium_xcuitest_version }}

      # the zoom fixture drives the simulator through the axe cli
      # (scripts/one-native-conformance.ts), which runner images do not ship.
      - name: Install axe
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/axe.tgz" \
            https://github.com/cameroncooke/AXe/releases/download/v1.8.0/AXe-macOS-v1.8.0-universal.tar.gz
          echo "7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version

      - name: Install native debugger CLI
        run: |
          bun install --global xcodebuildmcp@2.7.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/xcodebuildmcp" --version

      - name: Run One Native feature fixtures
        working-directory: tests/native-features
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
          IOS_TEST_CONTAINER_PATH_DEV: ${{ github.workspace }}/tests/native-features/ios/build/Build/Products/Debug-iphonesimulator/NativeFeatureTests.app
        run: bun run test-ios:dev --reporter=verbose

      - name: Upload One Native runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: one-native-features-ios
          include-hidden-files: true
          path: |
            tests/native-features/node_modules/.test/*-server.log
            /tmp/appium.log
            /tmp/appium-screenshots
            /tmp/one-native-zoom-e2e/*.json*
            /tmp/one-native-zoom-e2e/*.txt
            ~/Library/Developer/XcodeBuildMCP/workspaces/*/logs/**

  build-ios-test-container-dev:
    name: Build iOS RN Test App (Dev)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Debug

  build-ios-test-container-prod:
    name: Build iOS RN Test App (Prod)
    uses: ./.github/workflows/build-ios-test-container-app.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
    with:
      configuration: Release

  test-ios-native:
    name: Native iOS Tests (${{ matrix.env }}, ${{ matrix.bundler }})
    needs:
      - build-ios-test-container-dev
      - build-ios-test-container-prod
    runs-on: xcode-27
    # a slow runner roughly doubles this job: dev/metro ran 24m48s on 2026-08-15
    # and 45m51s on 2026-08-18, where the metro dev bundle alone went 22s -> 56s.
    # 45 killed that job 10 seconds after its tests had all passed.
    timeout-minutes: 60
    # rolldown:prod is experimental — don't fail the workflow on it.
    # (prod used to crash on launch with a SIGSEGV from an upstream RN
    # TurboModule/Hermes concurrency bug — now fixed via a builtInDepPatches
    # patch to react-native; see tests/test/IOS_PROD_CRASH.md. the harness also
    # fails a crash-on-launch fast (~10m) instead of timing out (~48m).)
    continue-on-error: ${{ matrix.env == 'prod' && matrix.bundler == 'rolldown' }}
    strategy:
      # one matrix entry's failure shouldn't kill the others — they're independent runs
      fail-fast: false
      matrix:
        include:
          - env: dev
            bundler: metro
            test-script: test-ios:dev
          - env: dev
            bundler: rolldown
            test-script: test-ios:rolldown:dev
          - env: prod
            bundler: metro
            test-script: test-ios:prod
          - env: prod
            bundler: rolldown
            test-script: test-ios:rolldown:prod
    steps:
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install
        with:
          install-playwright: 'false'

      - name: Download Built Test Container App (Dev)
        if: ${{ matrix.env == 'dev' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-dev.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-dev.outputs.built-app-path }}

      - name: Download Built Test Container App (Prod)
        if: ${{ matrix.env == 'prod' }}
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-prod.outputs.built-app-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.built-app-path }}

      - name: Download Hermes V1 hermesc
        if: ${{ matrix.env == 'prod' && needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
        id: download-hermesc
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.build-ios-test-container-prod.outputs.hermesc-cache-key }}
          path: ${{ needs.build-ios-test-container-prod.outputs.hermesc-path }}

      - name: Download Hermes V1 hermesc (Dev)
        if: ${{ matrix.env == 'dev' && matrix.bundler == 'rolldown' && needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
        id: download-hermesc-dev
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          key: ${{ needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
          path: ${{ needs.build-ios-test-container-dev.outputs.hermesc-path }}

      - name: Validate Hermes V1 hermesc (Dev)
        if: ${{ matrix.env == 'dev' && matrix.bundler == 'rolldown' }}
        env:
          HERMESC_CACHE_KEY: ${{ needs.build-ios-test-container-dev.outputs.hermesc-cache-key }}
          HERMESC_MATCHED_KEY: ${{ steps.download-hermesc-dev.outputs.cache-matched-key }}
          HERMESC_PATH: ${{ format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.hermesc-path) }}
        run: |
          [ -n "$HERMESC_MATCHED_KEY" ] || { echo "hermesc cache restore produced no matched key for $HERMESC_CACHE_KEY"; exit 1; }
          [ "$HERMESC_MATCHED_KEY" = "$HERMESC_CACHE_KEY" ] || { echo "hermesc key mismatch: wanted $HERMESC_CACHE_KEY, got $HERMESC_MATCHED_KEY"; exit 1; }
          [ -f "$HERMESC_PATH" ] || { echo "hermesc missing at $HERMESC_PATH"; exit 1; }
          [ -x "$HERMESC_PATH" ] || { echo "hermesc not executable at $HERMESC_PATH"; exit 1; }
          echo "hermesc validated: $HERMESC_PATH ($HERMESC_MATCHED_KEY)"

      - name: Prepare iOS UI tests
        id: setup-ios-ui-tests
        uses: ./.github/actions/ios-ui-test-setup
        with:
          simulator_ios_version: ${{ env.simulator_ios_version }}
          simulator_device_name: ${{ env.simulator_device_name }}
          appium_version: ${{ env.appium_version }}
          appium_xcuitest_version: ${{ env.appium_xcuitest_version }}

      - name: Run Tests
        env:
          SIMULATOR_UDID: ${{ steps.setup-ios-ui-tests.outputs.simulator_udid }}
          IOS_TEST_CONTAINER_PATH_DEV: ${{ matrix.env == 'dev' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.built-app-path) || '' }}
          IOS_TEST_CONTAINER_PATH_PROD: ${{ matrix.env == 'prod' && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.built-app-path) || '' }}
          HERMESC_PATH: ${{ steps.download-hermesc.outputs.cache-matched-key && format('{0}/{1}', github.workspace, needs.build-ios-test-container-prod.outputs.hermesc-path) || steps.download-hermesc-dev.outputs.cache-matched-key && format('{0}/{1}', github.workspace, needs.build-ios-test-container-dev.outputs.hermesc-path) || '' }}
        run: |
          bun run --filter test-test ${{ matrix.test-script }}

      - name: Upload Appium Logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-tests-${{ matrix.env }}-${{ matrix.bundler }}.log
          path: /tmp/appium.log

      - name: Upload Appium Screenshots
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: appium-screenshots-${{ matrix.env }}-${{ matrix.bundler }}
          path: /tmp/appium-screenshots
