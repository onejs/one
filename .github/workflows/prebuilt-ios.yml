name: Precompiled One iOS

on:
  pull_request:
    paths:
      - '.github/workflows/prebuilt-ios.yml'
      - 'scripts/package-one-ios.mts'
      - 'scripts/publish-one-ios.mts'
      - 'packages/one/One.podspec'
      - 'packages/one/ios/**'
      - 'packages/one/cpp/**'
      - 'packages/one/nitrogen/**'
      - 'packages/one/schema.json'
      - 'packages/one/ios-link-set.json'
      - 'packages/one/package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/prebuilt-ios.yml'
      - 'scripts/package-one-ios.mts'
      - 'scripts/publish-one-ios.mts'
      - 'packages/one/One.podspec'
      - 'packages/one/ios/**'
      - 'packages/one/cpp/**'
      - 'packages/one/nitrogen/**'
      - 'packages/one/schema.json'
      - 'packages/one/ios-link-set.json'
      - 'packages/one/package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: One iOS (${{ matrix.configuration }})
    # standard public arm64 runners, not a paid larger-runner pool.
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      ONE_PREBUILT_IOS: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
        with:
          workspace-focus: 'one'
          install-playwright: 'false'
      - name: Generate the native producer
        working-directory: tests/native-features
        run: bun run prebuild:native --platform ios --no-install
      - name: Build the complete release catalog
        run: rm -f tests/native-features/ios/one-link-set.json
      - name: Install producer dependencies using React Native binaries
        working-directory: tests/native-features/ios
        run: USE_FRAMEWORKS=static pod install
      - name: Build and package device and simulator libraries
        run: >-
          node scripts/package-one-ios.mts
          --ios tests/native-features/ios
          --configuration '${{ matrix.configuration }}'
          --output '${{ runner.temp }}/one-ios'
          --derived-data '${{ runner.temp }}/one-ios-build'
      - uses: actions/upload-artifact@v7
        with:
          name: one-ios-${{ matrix.configuration }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/one-ios/*.tar.gz
            ${{ runner.temp }}/one-ios/*.json

  publish:
    needs: validate-consumer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v7
        with:
          pattern: one-ios-*
          merge-multiple: true
          path: ${{ runner.temp }}/one-ios
      - name: Publish immutable compatible native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-one-ios.mts '${{ runner.temp }}/one-ios' --publish

  validate-consumer:
    name: Build a consumer with precompiled One
    needs: compile
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ONE_PREBUILT_IOS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
        with:
          workspace-focus: 'one'
          install-playwright: 'false'
      - uses: actions/download-artifact@v7
        with:
          pattern: one-ios-*
          merge-multiple: true
          path: ${{ runner.temp }}/one-ios
      - name: Generate the native consumer
        working-directory: tests/native-features
        run: bun run prebuild:native --platform ios --no-install
      - name: Use the producer's complete release catalog
        run: rm -f tests/native-features/ios/one-link-set.json
      - name: Verify and import the produced libraries
        run: |
          node scripts/publish-one-ios.mts '${{ runner.temp }}/one-ios'
          node packages/one/ios/prebuilt.ts import tests/native-features/ios '${{ runner.temp }}/one-ios'
      - name: Install pods with a required matching binary
        working-directory: tests/native-features/ios
        run: USE_FRAMEWORKS=static pod install
      - name: Compile the native consumer against the binaries
        working-directory: tests/native-features/ios
        run: >-
          xcodebuild -workspace NativeFeatureTests.xcworkspace -scheme NativeFeatureTests
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath '${{ runner.temp }}/one-consumer' -jobs 2
          -packageAuthorizationProvider netrc CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO ARCHS=arm64 build
