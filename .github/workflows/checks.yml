name: Checks and Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/CHANGELOG.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/CHANGELOG.md'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install
        with:
          install-playwright: 'false'

      - name: Security Audit
        # image-size and extract-zip have no fixed releases; both are patched in patchedDependencies.
        # recheck GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq, and GHSA-jmr9-qjv8-65gv by 2026-09-18.
        # GHSA-ggr8-5vv4-36mx is dev-only through webdriverio, which still pins deepmerge-ts 7.x;
        # recheck webdriverio support for the fixed deepmerge-ts 8.x by 2026-09-18.
        run: bun run audit

      - name: Check
        run: bun run check

      # workaround of node_modules/.bin/biome not being executable
      - run: chmod +x node_modules/@biomejs/biome/bin/biome

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install

      - name: Test
        run: |
          set -o pipefail
          # use timeout to force-kill tests if they hang (20 min should be plenty)
          # capture output to check if tests passed even if timeout kills hanging cleanup
          timeout --signal=KILL 1200 bun run test 2>&1 | tee test-output.log || {
            exit_code=$?
            if [ $exit_code -eq 137 ]; then
              echo "Process killed after timeout - checking if tests passed..."
              # check if vitest reported success before hanging
              if grep -q "Test Files.*passed" test-output.log && ! grep -q "FAIL \|Test Files.*failed" test-output.log; then
                echo "Tests passed but cleanup hung - treating as success"
                exit 0
              fi
              echo "Tests did not pass or had errors"
              exit 1
            fi
            exit $exit_code
          }
        env:
          NODE_OPTIONS: --max-old-space-size=4096
