name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish
        required: true
        default: canary
        type: choice
        options:
          - canary
          - patch
          - minor
          - major
          # publish the version already committed on main, bumping nothing.
          # `patch`/`minor`/`major` bump in-workflow and then have to push that
          # version commit to main, which main's protection rejects outright:
          # "GH006 ... Changes must be made through the merge queue". every
          # stable release attempt has died there. so land the version bump as
          # an ordinary pull request through the queue, then dispatch this to
          # publish it. see docs/releasing.md.
          - republish

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  ensure-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      # a canary is cuttable from ANY branch on purpose. requiring it to be
      # current main meant merging a change just to test it, which is backwards
      # for a throwaway build on its own dist-tag. a stable release still has to
      # be exactly current main.
      - name: Require current release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_KIND" != "canary" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi

          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq .object.sha)
          [[ "$TARGET_SHA" == "$source_sha" ]]

      # a canary is a throwaway version on its own dist-tag: nothing installs it
      # unless someone asks for it by name, and it never moves latest. gating it
      # on a full CI run cost 20+ minutes per cut, and when no run existed for
      # the sha this job DISPATCHED checks.yml and waited up to 90 minutes for
      # it, which is most of the wall clock of publishing a one-line fix. a
      # stable release still cannot publish without green CI below.
      - name: Require successful full CI
        if: inputs.release != 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          WORKFLOW_FILE: checks.yml
        shell: bash
        run: |
          set -euo pipefail

          get_runs() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
              -f head_sha="$TARGET_SHA" -f per_page=20
          }

          wait_for_run() {
            local run_id="$1"
            for ((attempt = 1; attempt <= 40; attempt++)); do
              read -r status conclusion < <(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  --jq '[.status, (.conclusion // "pending")] | @tsv'
              )
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                return
              fi
              sleep 120
            done
            echo "Timed out waiting for CI run $run_id" >&2
            return 1
          }

          runs=$(get_runs)
          run_id=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id // empty' <<< "$runs")
          if [[ -n "$run_id" ]]; then
            status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<< "$runs")
            conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // "pending"' <<< "$runs")
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Full CI already passed for $TARGET_SHA."
              exit 0
            fi
            if [[ "$status" != "completed" ]] && wait_for_run "$run_id"; then
              echo "Existing full CI passed for $TARGET_SHA."
              exit 0
            fi
          fi

          started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -f ref="$TARGET_REF"

          run_id=''
          for ((attempt = 1; attempt <= 12; attempt++)); do
            sleep 10
            runs=$(get_runs)
            run_id=$(jq -r --arg started "$started" \
              '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")
            [[ -n "$run_id" ]] && break
          done
          [[ -n "$run_id" ]]
          wait_for_run "$run_id"

  publish:
    needs: ensure-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        env:
          RELEASE_KIND: ${{ inputs.release }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_REF"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]]
          if [[ "$RELEASE_KIND" != "canary" ]]; then
            [[ "$TARGET_REF" == "main" ]]
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # republish takes the version exactly as main already has it, so there is
      # nothing to prepare and nothing to push.
      - name: Prepare release commit
        if: inputs.release != 'republish'
        env:
          RELEASE_KIND: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'One Release'
          git config user.email 'one@users.noreply.github.com'
          bun scripts/release.ts "--$RELEASE_KIND" --ci --dirty --skip-publish --skip-push --skip-tests --skip-native-tests

      # a canary publishes the prepared working tree and mutates no git at all,
      # matching what orez and takeout canaries already do. pushing a throwaway
      # version commit to main is what actually broke this: main now requires a
      # pull request and a merge queue, so the push is rejected with GH006 and
      # the publish step below never runs. the version bump only has to exist in
      # the tree for npm, never on main.
      #
      # the same rejection kills patch/minor/major, which DO need their version
      # commit on main. those have never once published: every Release run in
      # this repo's history failed here. use `republish` instead, which expects
      # the version commit to already be on main via a normal pull request.
      - name: Push release commit
        if: inputs.release != 'canary' && inputs.release != 'republish'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$TARGET_SHA" ]]
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push origin HEAD:main

      - name: Publish prepared version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/one/package.json').version")
          flags=(--republish --ci --dirty --skip-finish)
          if [[ "$version" =~ -[0-9]{10,}$ ]]; then
            flags+=(--canary)
          fi
          bun scripts/release.ts "${flags[@]}"

      - name: Push stable tag
        if: inputs.release != 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/one/package.json').version")
          # the bump path tags as part of preparing the version. republish has
          # no prepare step, so tag the main commit that already carries this
          # version. the assertion below guards both paths identically.
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            git tag "v$version"
          fi
          [[ "$(git rev-list -n 1 "v$version")" == "$(git rev-parse HEAD)" ]]
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push origin "v$version"
          bash scripts/gen-release-notes.sh "v$version" release-notes.md
          gh release create "v$version" --verify-tag --notes-file release-notes.md --title "v$version"
