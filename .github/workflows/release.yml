name: Release

on:
  # stable releases require an explicit dispatch after the release pr is approved.
  push:
    branches: [v2-beta]
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish
        required: true
        default: beta
        type: choice
        options:
          - canary
          - beta
          - patch
          - minor
          - major
          # publish the version prepared in the approved release pr.
          - republish
      force:
        description: Skip the CI gate for an owner-authorized emergency release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # manual branch canaries must not be replaced by pending beta push releases.
  group: npm-release-${{ github.event_name == 'push' && 'canary' || inputs.release == 'canary' && format('canary-{0}', github.ref) || inputs.release == 'beta' && 'beta' || 'stable' }}
  cancel-in-progress: false

jobs:
  ensure-ci:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    steps:
      # a canary is cuttable from ANY branch on purpose. requiring it to be
      # current main meant merging a change just to test it, which is backwards
      # for a throwaway build on its own dist-tag. a stable release still has to
      # be exactly current main.
      - name: Require current release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_KIND" == "beta" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/v2-beta" ]]
          elif [[ "$RELEASE_KIND" != "canary" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi

          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq .object.sha)
          [[ "$TARGET_SHA" == "$source_sha" ]]

      # a canary is a throwaway version on its own dist-tag: nothing installs it
      # unless someone asks for it by name, and it never moves latest. gating it
      # on a full CI run cost 20+ minutes per cut, and when no run existed for
      # the sha this job DISPATCHED checks.yml and waited up to 90 minutes for
      # it, which is most of the wall clock of publishing a one-line fix. a
      # stable release still cannot publish without green CI below.
      - name: Require successful full CI
        if: inputs.release != 'canary' && inputs.force != true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          WORKFLOW_FILE: checks.yml
        shell: bash
        run: |
          set -euo pipefail

          get_runs() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
              -f head_sha="$TARGET_SHA" -f per_page=20
          }

          wait_for_run() {
            local run_id="$1"
            for ((attempt = 1; attempt <= 40; attempt++)); do
              read -r status conclusion < <(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                  --jq '[.status, (.conclusion // "pending")] | @tsv'
              )
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                return
              fi
              sleep 120
            done
            echo "Timed out waiting for CI run $run_id" >&2
            return 1
          }

          runs=$(get_runs)
          run_id=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id // empty' <<< "$runs")
          if [[ -n "$run_id" ]]; then
            status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<< "$runs")
            conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // "pending"' <<< "$runs")
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "Full CI already passed for $TARGET_SHA."
              exit 0
            fi
            if [[ "$status" != "completed" ]] && wait_for_run "$run_id"; then
              echo "Existing full CI passed for $TARGET_SHA."
              exit 0
            fi
          fi

          started=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -f ref="$TARGET_REF"

          run_id=''
          for ((attempt = 1; attempt <= 12; attempt++)); do
            sleep 10
            runs=$(get_runs)
            run_id=$(jq -r --arg started "$started" \
              '[.workflow_runs[] | select(.event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")
            [[ -n "$run_id" ]] && break
          done
          [[ -n "$run_id" ]]
          wait_for_run "$run_id"

  publish:
    needs: ensure-ci
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || needs.ensure-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        env:
          RELEASE_KIND: ${{ github.event_name == 'push' && 'canary' || inputs.release }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_REF"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          if [[ "$RELEASE_KIND" == "beta" || "$RELEASE_KIND" == "canary" ]]; then
            # v2-beta moves every few minutes and a beta pushes nothing back, so
            # it ships any commit on the branch, not only a tip that outlived ci
            [[ "$RELEASE_KIND" == "canary" || "$TARGET_REF" == "v2-beta" ]]
            git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD
          else
            [[ "$(git rev-parse FETCH_HEAD)" == "$TARGET_SHA" ]]
            [[ "$RELEASE_KIND" == "canary" || "$TARGET_REF" == "main" ]]
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.1

      - name: Cache canary builds
        if: (github.event_name == 'push' && github.ref_name == 'v2-beta') || inputs.release == 'canary'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo/cache
          key: one-canary-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            one-canary-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            one-canary-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish V2 beta
        if: inputs.release == 'beta'
        env:
          BETA_VERSION: 2.0.0-beta.${{ github.run_number }}.${{ github.run_attempt }}
        run: >-
          bun scripts/release.ts
          --beta
          --version "$BETA_VERSION"
          --ci
          --dirty
          --skip-finish
          --skip-tests
          --skip-native-tests

      - name: Publish V2 canary
        if: (github.event_name == 'push' && github.ref_name == 'v2-beta') || inputs.release == 'canary'
        run: bun scripts/release.ts --canary --ci --dirty --skip-finish

      # republish takes the version exactly as main already has it, so there is
      # nothing to prepare and nothing to push.
      - name: Prepare release commit
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary' && inputs.release != 'republish' && inputs.release != 'beta'
        env:
          RELEASE_KIND: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'One Release'
          git config user.email 'one@users.noreply.github.com'
          current=$(node -p "require('./packages/one/package.json').version")
          latest=$(npm view one@latest version)
          newer=$(node -e 'console.log(require("semver").gt(process.argv[1], process.argv[2]))' "$current" "$latest")
          if [[ "$newer" == "true" ]]; then
            prepared_kind=$(node -e 'console.log(require("semver").diff(process.argv[1], process.argv[2]))' "$latest" "$current")
            if [[ "$prepared_kind" != "$RELEASE_KIND" ]]; then
              echo "Prepared $current requires $prepared_kind, not $RELEASE_KIND" >&2
              exit 1
            fi
            echo "Publishing the prepared $RELEASE_KIND version $current"
            exit 0
          fi
          node -e 'const f="./packages/one/package.json",j=require(f);j.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$latest"
          bun scripts/release.ts "--$RELEASE_KIND" --ci --dirty --skip-publish --skip-push --skip-tests --skip-native-tests

      # prepared stable versions are tagged; protected main is changed only by prs.
      - name: Publish prepared version
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary' && inputs.release != 'beta'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/one/package.json').version")
          flags=(--republish --ci --dirty --skip-finish)
          if [[ "$version" =~ -[0-9]{10,}$ ]]; then
            flags+=(--canary)
          fi
          bun scripts/release.ts "${flags[@]}"

      - name: Push stable tag
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary' && inputs.release != 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/one/package.json').version")
          # the bump path tags as part of preparing the version. republish has
          # no prepare step, so tag the main commit that already carries this
          # version. the assertion below guards both paths identically.
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            git tag "v$version"
          fi
          [[ "$(git rev-list -n 1 "v$version")" == "$(git rev-parse HEAD)" ]]
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push origin "v$version"

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release != 'canary' && inputs.release != 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./packages/one/package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi
          bash scripts/gen-release-notes.sh "$tag" release-notes.md
          gh release create "$tag" --verify-tag --notes-file release-notes.md --title "$tag"
