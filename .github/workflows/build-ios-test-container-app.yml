name: Build iOS Test Container App
env:
  # Relative path from the monorepo root to the app
  test_container_app_path: tests/rn-test-container
  # Package name in the monorepo
  test_app_package_name: rn-test-container
  # Should match the name of "ios/<app_name>.xcworkspace"
  ios_app_name: RNTestContainer
  # A unique ID to identify the app on GitHub Actions, this is used as part of cache keys and artifact names, must be unique among all workflows
  app_id: ios-rn-test-container-app
  ONE_PREBUILT_IOS: '1'
  RCT_USE_PREBUILT_RNCORE: '1'
  RCT_USE_RN_DEP: '1'

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
        description: "Either 'Debug' or 'Release'."
      one-ios-key:
        required: true
        type: string
        description: Compatibility key of the One iOS libraries used to build this app
      one-ios-published:
        required: true
        type: boolean
        description: Whether the libraries are published or attached to this run
    outputs:
      build-hash:
        description: "A hash to identify the build."
        value: ${{ jobs.build-ios.outputs.build-hash }}
      built-app-cache-key:
        description: "The GitHub Actions cache key of the built .app, can be used in subsequent workflows to get the built app from cache using this key."
        value: ${{ jobs.build-ios.outputs.built-app-cache-key }}
      built-app-path:
        description: "The path to the built .app relative to the repository root."
        value: ${{ jobs.build-ios.outputs.built-app-path }}
      hermesc-cache-key:
        description: "Cache key for the Hermes V1 hermesc binary."
        value: ${{ jobs.build-ios.outputs.hermesc-cache-key }}
      hermesc-path:
        description: "Path to the hermesc binary relative to the repository root."
        value: ${{ jobs.build-ios.outputs.hermesc-path }}

jobs:
  build-ios:
    name: Build
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    outputs:
      built-app-cache-key: ${{ steps.check-has-build.outputs.cache-primary-key || steps.pre-check-has-build.outputs.cache-primary-key }} # The order is important here, since in the "pre-check-has-build" step, it's possible that the build hash part of the key is "null" - in such case, the cache won't be found at that step and the `check-has-build` step will be executed. So it's always safe to place the `check-has-build` before the `pre-check-has-build` step for this condition.
      build-hash: ${{ steps.calculate-build-hash.outputs.build_hash || steps.get-build-hash-from-cache.outputs.build_hash }} # Same as above, the order is important here.
      built-app-path: ${{ steps.get-built-app-path.outputs.built_app_path }}
      hermesc-cache-key: ${{ format('{0}-hermesc-{1}', env.app_id, steps.calculate-build-hash.outputs.build_hash || steps.get-build-hash-from-cache.outputs.build_hash) }}
      hermesc-path: ${{ steps.find-hermesc.outputs.hermesc_path || 'tests/rn-test-container/hermesc' }}
    defaults:
      run:
        working-directory: ${{ env.test_container_app_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Built App Path
        id: get-built-app-path
        env:
          BUILT_APP_PATH: ${{ env.test_container_app_path }}/build/Build/Products/${{ inputs.configuration }}-iphonesimulator/${{ env.ios_app_name }}.app
        run: |
          echo "Built app path: $BUILT_APP_PATH"
          echo "built_app_path=$BUILT_APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Calculate Pre-Build Hash
        id: calculate-pre-build-hash
        env:
          ONE_IOS_KEY: ${{ inputs.one-ios-key }}
          NATIVE_INPUTS: ${{ hashFiles('bun.lock', '.node-version', 'tests/rn-test-container/package.json', 'tests/rn-test-container/vite.config.ts', 'tests/rn-test-container/react-native.config.cjs', 'tests/rn-test-container/app/**', 'packages/vxrn/**', 'packages/one/package.json', 'packages/one/nitro.json', 'packages/one/src/platform/specs/**', 'packages/one/codegen/sdk/**', 'packages/one/ios-bindings/**', '.github/workflows/build-ios-test-container-app.yml') }}
        run: |
          test -n "$NATIVE_INPUTS"
          test -n "$ONE_IOS_KEY"
          digest=$(printf '%s\n' "$NATIVE_INPUTS" "$ONE_IOS_KEY" | shasum -a 256 | cut -d' ' -f1)
          echo "pre_build_hash=$digest" >> "$GITHUB_OUTPUT"

      - name: Read Cached Build Hash
        id: get-build-hash-from-cache
        env:
          KV_STORE_REDIS_REST_URL: ${{ secrets.KV_STORE_REDIS_REST_URL }}
          KV_STORE_REDIS_REST_TOKEN: ${{ secrets.KV_STORE_REDIS_REST_TOKEN }}
          # include configuration in key so Debug/Release don't share stale hashes
          REDIS_KEY: ${{ env.app_id }}-${{ inputs.configuration }}-build-hash-from-pre-build-hash-${{ steps.calculate-pre-build-hash.outputs.pre_build_hash }}
        run: |
          BUILD_HASH_FROM_CACHE=$(curl "$KV_STORE_REDIS_REST_URL/get/$REDIS_KEY" -H "Authorization: Bearer $KV_STORE_REDIS_REST_TOKEN" | jq -r '.result')

          if [ "$BUILD_HASH_FROM_CACHE" != "null" ]; then
            curl -X POST "$KV_STORE_REDIS_REST_URL/EXPIRE/$REDIS_KEY/2592000" -H "Authorization: Bearer $KV_STORE_REDIS_REST_TOKEN" # Reset TTL to 30 days
            echo "Build hash from cache: $BUILD_HASH_FROM_CACHE"
            echo "build_hash=$BUILD_HASH_FROM_CACHE" >> "$GITHUB_OUTPUT"
          else
            echo 'No cached build hash found.'
            echo "build_hash=null" >> "$GITHUB_OUTPUT"
          fi

      - name: Check If Build Already Exists
        uses: actions/cache/restore@v5
        id: pre-check-has-build
        if: ${{ steps.get-build-hash-from-cache.outputs.build_hash != 'null' }}
        with:
          key: ${{ env.app_id }}-${{ inputs.configuration }}-${{ steps.get-build-hash-from-cache.outputs.build_hash }}
          lookup-only: true
          path: ${{ steps.get-built-app-path.outputs.built_app_path }}

      # The steps below are somehow WET (Write Everything Twice) since GitHub Actions doesn't support early exit at the time of writing.
      # So we basically add a if condition to every step below to skip them if we have a cache hit.

      - name: Install
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        uses: ./.github/actions/install
        with:
          # To save time, only install dependencies for the test container app
          workspace-focus: ${{ env.test_app_package_name }}
          install-playwright: 'false'

      - uses: ./.github/actions/cache-ios-sdk
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        with:
          workspace: rn-test-container

      - name: Prebuild
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        run: |
          bun run prebuild:native --platform ios --no-install
          # the container also runs bundles from the separate test workspace.
          rm -f ios/one-link-set.json

      - name: Download One iOS libraries
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !inputs.one-ios-published }}
        uses: actions/download-artifact@v7
        with:
          pattern: one-ios-*
          merge-multiple: true
          path: ${{ runner.temp }}/one-ios

      - name: Import the libraries built in this run
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !inputs.one-ios-published }}
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/publish-one-ios.mts "$RUNNER_TEMP/one-ios"
          node packages/one/ios/prebuilt.mjs import tests/rn-test-container/ios "$RUNNER_TEMP/one-ios"

      - name: Cache Pods
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        uses: actions/cache@v5
        with:
          path: ${{ env.test_container_app_path }}/ios/Pods
          key: ${{ runner.os }}-${{ env.app_id }}-pods-${{ inputs.one-ios-key }}-${{ hashFiles('bun.lock', format('{0}/ios/Podfile', env.test_container_app_path), '.github/workflows/build-ios-test-container-app.yml') }}

      - name: Install pods with precompiled One and React Native
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        run: USE_FRAMEWORKS=static pod install --project-directory=ios

      - name: Calculate Build Hash
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        id: calculate-build-hash
        env:
          PRE_BUILD_HASH: ${{ steps.calculate-pre-build-hash.outputs.pre_build_hash }}
          PODS_HASH: ${{ hashFiles(format('{0}/ios/Podfile.lock', env.test_container_app_path)) }}
        run: |
          test -n "$PODS_HASH"
          digest=$(printf '%s\n' "$PRE_BUILD_HASH" "$PODS_HASH" | shasum -a 256 | cut -d' ' -f1)
          echo "build_hash=$digest" >> "$GITHUB_OUTPUT"

      - name: Write Build Hash
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        env:
          KV_STORE_REDIS_REST_URL: ${{ secrets.KV_STORE_REDIS_REST_URL }}
          KV_STORE_REDIS_REST_TOKEN: ${{ secrets.KV_STORE_REDIS_REST_TOKEN }}
          REDIS_KEY: ${{ env.app_id }}-${{ inputs.configuration }}-build-hash-from-pre-build-hash-${{ steps.calculate-pre-build-hash.outputs.pre_build_hash }}
        run: |
          curl -X POST "$KV_STORE_REDIS_REST_URL/SETEX/$REDIS_KEY/2592000/${{ steps.calculate-build-hash.outputs.build_hash }}" -H "Authorization: Bearer $KV_STORE_REDIS_REST_TOKEN" # Save and set TTL to 30 days

      - name: Check If Build Already Exists
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit }}
        uses: actions/cache/restore@v5
        id: check-has-build
        with:
          key: ${{ env.app_id }}-${{ inputs.configuration }}-${{ steps.calculate-build-hash.outputs.build_hash }}
          lookup-only: true
          path: ${{ steps.get-built-app-path.outputs.built_app_path }}

      - name: Build
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !steps.check-has-build.outputs.cache-hit }}
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -o pipefail # Since we pipe the output to xcpretty, we need this to fail this step if `xcrun xcodebuild` fails
          xcrun xcodebuild -scheme '${{ env.ios_app_name }}' \
            -workspace 'ios/${{ env.ios_app_name }}.xcworkspace' \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk 'iphonesimulator' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -packageAuthorizationProvider netrc \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=arm64 \
            | tee xcodebuild.log | xcpretty

      - name: Stage the compiler from the Hermes pod
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !steps.check-has-build.outputs.cache-hit }}
        id: find-hermesc
        run: |
          install -m 755 ios/Pods/hermes-engine/destroot/bin/hermesc hermesc
          echo "hermesc_path=${{ env.test_container_app_path }}/hermesc" >> "$GITHUB_OUTPUT"

      - name: Cache hermesc
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !steps.check-has-build.outputs.cache-hit && steps.find-hermesc.outputs.hermesc_path }}
        uses: actions/cache/save@v5
        with:
          key: ${{ env.app_id }}-hermesc-${{ steps.calculate-build-hash.outputs.build_hash }}
          path: ${{ steps.find-hermesc.outputs.hermesc_path }}

      - name: Upload Built App to Cache
        if: ${{ !steps.pre-check-has-build.outputs.cache-hit && !steps.check-has-build.outputs.cache-hit }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.check-has-build.outputs.cache-primary-key }}
          path: ${{ steps.get-built-app-path.outputs.built_app_path }}

      - name: Upload Build Log
        uses: actions/upload-artifact@v7
        if:  ${{ always() && !steps.pre-check-has-build.outputs.cache-hit && !steps.check-has-build.outputs.cache-hit }}
        with:
          name: xcodebuild-${{ env.app_id }}-${{ inputs.configuration }}.log
          overwrite: true
          path: |
            ${{ env.test_container_app_path }}/xcodebuild.log
