name: Android Native Build

on:
  push:
    branches:
      - main
      - v2-beta
    paths:
      - '.github/actions/install/**'
      - '.github/workflows/test-native-android.yml'
      - 'bun.lock'
      - 'package.json'
      - 'patches/**'
      - 'packages/one/**'
      - 'packages/vxrn/**'
      - 'packages/vite-plugin-metro/**'
      - 'tests/native-features/**'
      - 'examples/one-basic/**'
  pull_request:
    paths:
      - '.github/actions/install/**'
      - '.github/workflows/test-native-android.yml'
      - 'bun.lock'
      - 'package.json'
      - 'patches/**'
      - 'packages/one/**'
      - 'packages/vxrn/**'
      - 'packages/vite-plugin-metro/**'
      - 'tests/native-features/**'
      - 'examples/one-basic/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-android-native:
    name: Compile One Native Android consumer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
      # caches gradle dependencies and the wrapper; pushes write it, pull requests read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
          workspace-focus: one
      # checks.yml runs the whole One suite; this job runs only the android
      # contracts, so an unrelated web test cannot red the android build.
      - name: Verify fixture prebuild and native Android contracts
        working-directory: packages/one
        run: >-
          bun run vitest --run
          src/nativeFixturePrebuild.test.ts tests/nativeCoverage.test.ts
          src/cli/prebuild.test.ts src/cli/runAndroid.test.ts
          src/native/appManifest.test.ts src/platform/AndroidMenu.test.tsx
          src/platform/nativeBarrel.test.ts tests/compose.test.ts
          tests/syncCompose.test.tsx tests/nativeDocs.test.ts
      - name: Generate the Basic starter Android project
        working-directory: examples/one-basic
        run: bun run prebuild:native --platform android --no-install
      - name: Generate the native features Android project
        working-directory: tests/native-features
        run: bun run prebuild:native --platform android --no-install
      - name: Compile Kotlin, Compose, Fabric, Nitro, and the consumer APK
        working-directory: tests/native-features/android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug -PreactNativeArchitectures=x86_64
      - name: Upload native consumer APK
        uses: actions/upload-artifact@v7
        with:
          name: one-native-android-debug
          path: tests/native-features/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-native-fixtures:
    name: One Native Android fixtures
    needs: build-android-native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIXTURE_AVD_IMAGE: 'system-images;android-37.0;google_apis;x86_64'
      FIXTURE_PACKAGE: dev.vxrn.nativefeatures.tests
      FIXTURE_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # the clipboard suite compiles its device-side setter with d8.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator platforms;android-37.0 build-tools;37.0.0 ${{ env.FIXTURE_AVD_IMAGE }}"
      - uses: ./.github/actions/install
        with:
          install-playwright: 'false'
          workspace-focus: one
      - name: Download native consumer APK
        uses: actions/download-artifact@v7
        with:
          name: one-native-android-debug
          path: ${{ runner.temp }}/apk
      # the fixture runner was calibrated on a pixel 8 api 37 emulator.
      - name: Boot the API 37 emulator
        run: |
          echo no | avdmanager create avd -n one-fixtures -k "$FIXTURE_AVD_IMAGE" -d pixel_8
          nohup "$ANDROID_HOME/emulator/emulator" -avd one-fixtures -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          until [ "$(adb -s "$FIXTURE_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
          adb -s "$FIXTURE_SERIAL" shell getprop ro.build.version.sdk
      - name: Start the fixture dev server
        working-directory: tests/native-features
        run: |
          nohup bun run dev --port 8081 > "$RUNNER_TEMP/dev-server.log" 2>&1 &
          until curl -s -o /dev/null http://localhost:8081/; do sleep 2; done
      - name: Install the fixture app
        run: |
          adb -s "$FIXTURE_SERIAL" install -r "$RUNNER_TEMP/apk/app-debug.apk"
          adb -s "$FIXTURE_SERIAL" reverse tcp:8081 tcp:8081
          # build the android bundle once so the first suite's mount wait measures the app, not bundling.
          if ! curl -sSf -o /dev/null 'http://localhost:8081/index.bundle?platform=android&dev=true'; then
            # record why the dev server stopped answering before failing.
            free -m
            ps -eo pid,rss,etime,args --sort=-rss | head -15
            ss -ltnp
            sudo dmesg | tail -30
            exit 1
          fi
      - name: Run One Native Android fixtures
        working-directory: tests/native-features
        run: |
          failed=()
          for suite in proof compose compose-badges compose-list-items compose-flow-row \
            compose-icon-buttons compose-loading compose-surface compose-progress compose-segmented \
            compose-pickers compose-lists compose-image compose-snackbar compose-sheet \
            compose-navigation-bar compose-search-bar compose-dropdown-menu compose-pull-to-refresh \
            compose-tooltip compose-animated-visibility ui-image ui-text-input ui-icon ui-effects \
            portal pager open database color menus system system-app-icon system-share \
            system-location system-clipboard state network document-picker launch-screen adaptive-flat; do
            echo "::group::$suite"
            if bun scripts/one-native-conformance.android.ts --device-id "$FIXTURE_SERIAL" \
              --package-id "$FIXTURE_PACKAGE" --suite "$suite" \
              --artifact-dir "$RUNNER_TEMP/fixtures/$suite"; then
              echo "SUITE PASS $suite"
            else
              echo "SUITE FAIL $suite"
              failed+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed suites: ${failed[*]}"
            exit 1
          fi
      - name: Upload Android fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: one-native-android-fixtures
          path: |
            ${{ runner.temp }}/fixtures
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/dev-server.log
          if-no-files-found: warn
