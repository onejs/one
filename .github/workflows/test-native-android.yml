name: Notification shade investigation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SDK_PACKAGES: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0 system-images;android-37.0;google_apis;x86_64'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/android-sdk-package-cache
        with:
          packages: ${{ env.ANDROID_SDK_PACKAGES }}
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ env.ANDROID_SDK_PACKAGES }}
      - name: Boot isolated emulator
        run: |
          echo no | avdmanager create avd -n notification-probe -k 'system-images;android-37.0;google_apis;x86_64' -d pixel_8
          nohup "$ANDROID_HOME/emulator/emulator" -avd notification-probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
          adb shell input keyevent 82
          adb shell wm dismiss-keyguard
      - name: Capture posted notifications across home transitions
        run: |
          mkdir -p "$RUNNER_TEMP/shade"
          adb shell cmd notification help > "$RUNNER_TEMP/shade/notification-help.txt"
          capture() {
            adb shell uiautomator dump /sdcard/shade.xml
            adb pull /sdcard/shade.xml "$RUNNER_TEMP/shade/$1.xml"
            adb exec-out screencap -p > "$RUNNER_TEMP/shade/$1.png"
            adb shell dumpsys notification --noredact > "$RUNNER_TEMP/shade/$1-notifications.txt"
            adb shell dumpsys activity service com.android.systemui/.SystemUIService > "$RUNNER_TEMP/shade/$1-systemui.txt"
            adb shell dumpsys window > "$RUNNER_TEMP/shade/$1-window.txt"
          }
          adb shell cmd notification post -t 'N5 cat' n5-cat 'category'
          adb shell cmd notification post -t 'N3 unobserved' n3-unobserved 'unobserved'
          adb shell cmd notification post -t 'N3 ping' n3-1 'arrival 1'
          adb shell am start -W -a android.settings.SETTINGS
          adb shell input keyevent 3
          adb shell cmd statusbar expand-notifications
          capture home-race
          adb shell cmd statusbar collapse
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
          adb shell cmd statusbar expand-notifications
          capture home-settled
          adb logcat -d -v threadtime -b all > "$RUNNER_TEMP/shade/logcat.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-shade-probe
          path: |
            ${{ runner.temp }}/shade/
            ${{ runner.temp }}/emulator.log
