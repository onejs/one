name: Android SDK package cache
description: >-
  sdkmanager unzips a download without checking its length, so a transfer that
  ends early fails setup. this restores one installed sdk package before
  setup-android, which then skips it, or saves the package setup-android
  installed, keyed on its package id and installed revision. on a miss
  sdkmanager downloads the package as before.
inputs:
  package:
    description: sdkmanager package id, such as ndk;27.1.12297006
    required: true
  save:
    description: "'true' saves the installed package instead of restoring it"
    default: 'false'
runs:
  using: composite
  steps:
    - id: locate
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        dir="$ANDROID_HOME/${PACKAGE//;//}"
        key="android-sdk-$RUNNER_OS-${PACKAGE//;/-}-"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        if [ '${{ inputs.save }}' = true ]; then
          echo "revision=$(sed -n 's/^Pkg.Revision=//p' "$dir/source.properties")" >> "$GITHUB_OUTPUT"
        fi
    - if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}
        restore-keys: ${{ steps.locate.outputs.key }}
    - if: ${{ inputs.save == 'true' }}
      id: saved
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}${{ steps.locate.outputs.revision }}
        lookup-only: true
    - if: ${{ inputs.save == 'true' && steps.saved.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}${{ steps.locate.outputs.revision }}
